name: Build and deploy to GitHub Pages

# This is a static site built by build.py (Python standard library only, no Node/Next.js).
# Requires: repo Settings -> Pages -> Source = "GitHub Actions" (already enabled on this repo).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        # On a custom domain the site is served at "/", so BASE_PATH is empty.
        # Without one, GitHub Pages serves this project page under "/<repo-name>/",
        # so templates' root-relative hrefs/srcs need that prefix to resolve.
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            export BASE_PATH=""
          else
            export BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          fi
          echo "Using BASE_PATH='$BASE_PATH'"
          python3 -I build.py

      - name: Write custom domain (CNAME)
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
